[project]
name = "machines"
version = "0.0.0"
description = "Recorder for Machine Diagrams (runs on CPython and inside Pyodide)"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "numpy==2.4.6",
  "pandas==3.0.2",
  "scikit-learn==1.8.0",
  "scipy==1.18.0",
  "matplotlib==3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/machines"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
src = ["python"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
